name: Collecte quotidienne des offres

on:
  schedule:
    - cron: "23 6 * * *"    # 07:23 à Tunis et Lagos, 06:23 à Conakry
    # Secours : GitHub retarde ou saute parfois les exécutions planifiées.
    # Si la collecte du jour a déjà eu lieu, celle-ci s'arrête tout de suite.
    - cron: "17 13 * * *"
  workflow_dispatch:        # bouton pour lancer à la main depuis l'onglet Actions

permissions:
  contents: write

# Une seule collecte à la fois : une deuxième exécution attend la fin de la première.
concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      # Toujours partir de la dernière version de main, même en cas de "Re-run".
      - uses: actions/checkout@v4
        with:
          ref: main

      # Seulement pour les exécutions planifiées : un lancement à la main collecte toujours.
      - name: Vérifier si la collecte du jour a déjà eu lieu
        id: deja
        if: github.event_name == 'schedule'
        run: |
          if grep -q "^$(date -u +%F)," data/stats_journalieres.csv; then
            echo "La collecte du $(date -u +%F) a déjà eu lieu, rien à faire."
            echo "fait=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.deja.outputs.fait != 'oui'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.deja.outputs.fait != 'oui'

      - name: Collecter les offres
        if: steps.deja.outputs.fait != 'oui'
        run: python src/collect.py

      - name: Commiter les données
        if: steps.deja.outputs.fait != 'oui'
        env:
          AUTEUR_EMAIL: ${{ secrets.COMMIT_EMAIL }}
        run: |
          git config user.name "Abusooma"
          git config user.email "$AUTEUR_EMAIL"
          git add data/ README.md
          if git diff --cached --quiet; then
            echo "Rien à commiter."
          else
            git commit -F .commit_msg
            git pull --rebase origin main
            git push origin main
          fi
